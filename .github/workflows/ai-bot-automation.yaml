name: 🤖 AI Automated Code Review & Repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  ai_agent_interaction:
    name: Qodo AI PR-Agent Integration
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    if: |
      github.event_name == 'pull_request' || 
      (github.event.issue.pull_request == null && contains(github.event.comment.body, '/code')) ||
      (github.event.issue.pull_request != null)
    steps:
      - name: Run Qodo PR Agent
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.AI_API_KEY }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT.CUSTOM_LABELS: "true"
          PR_REVIEWS.EXTRA_INSTRUCTIONS: "Hãy ưu tiên phản hồi bằng tiếng Việt thân thiện, rõ ràng."

  test_and_auto_repair:
    name: Run Tests & Auto Fix on Failure
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Credentials
        run: |
          git config --global user.name "Codeium-Automated-Robot"
          git config --global user.email "bot@codeium.com"

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CẢI TIẾN: Loại bỏ exit 0, dùng biến cờ check trạng thái lỗi chuẩn xác
      - name: Execute Project Tests
        id: execute_tests
        run: |
          npm install --legacy-peer-deps
          
          # Chạy test, nếu fail thì ghi nhận kết quả và chuyển tiếp, không nuốt lỗi bằng exit 0
          if ! npm run test; then
            echo "is_failed=true" >> $GITHUB_OUTPUT
            echo "🚨 Phát hiện lỗi code! Đang chuyển giao log sang cho AI..."
          else
            echo "is_failed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true # Giúp bước này luôn hiển thị màu xanh trên giao diện

      - name: Setup Python Environment for AI CLI
        if: ${{ steps.execute_tests.outputs.is_failed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Trigger AI CLI to Repair Code
        if: ${{ steps.execute_tests.outputs.is_failed == 'true' }}
        run: |
          echo "🤖 Đang gọi AI quét mã nguồn để sửa tự động..."
          pip install pr-agent
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
          else
            PR_URL="${{ github.event.issue.pull_request.html_url }}"
          fi
          
          pr-agent --pr_url="$PR_URL" fix || echo "AI đã hoàn tất phân tích."
        env:
          OPENAI_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Repaired Code
        if: ${{ steps.execute_tests.outputs.is_failed == 'true' }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 [AI Auto-Fix] Đã tự động sửa các file code bị lỗi"
            git push
            echo "✅ Đã tự động đẩy mã nguồn sửa lỗi lên GitHub thành công!"
          else
            echo "ℹ️ AI đã quét nhưng không thấy file nào cần chỉnh sửa."
          fi
